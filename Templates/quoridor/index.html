<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>コリドール - ルーム作成</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1e1e1e; padding: 2rem; border-radius: 12px; width: 90%; max-width: 400px; box-sizing: border-box; }
    h1 { font-size: 1.5rem; text-align: center; margin-top: 0; }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; font-size: 0.9rem; margin-bottom: 0.4rem; color: #aaa; }
    input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 1rem; box-sizing: border-box; }
    button { width: 100%; padding: 14px; background: #3b82f6; border: none; border-radius: 8px; color: #fff; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
    button:active { background: #2563eb; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚔️ コリドールルーム作成</h1>
    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label>部屋名</label>
        <input type="text" name="name" value="タブレット対戦部屋" required>
      </div>
      <div class="form-group">
        <label>盤面サイズ</label>
        <select name="board_size">
          <option value="5">5 × 5 (超クイック)</option>
          <option value="7">7 × 7 (ショート)</option>
          <option value="9" selected>9 × 9 (標準公式ルール)</option>
          <option value="11">11 × 11 (ロング)</option>
        </select>
      </div>
      <div class="form-group">
        <label>1人あたりの壁の枚数</label>
        <input type="number" name="fences_per_player" value="10" min="2" max="20" required>
      </div>
      <button type="submit">ゲーム開始</button>
    </form>
  </div>
</body>
</html>
