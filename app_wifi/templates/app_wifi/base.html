<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Wi-Fiプロファイル{% endblock %}</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--panel:#121e30;--line:#26364d;--text:#edf4ff;--muted:#9fb0c6;--blue:#3b82f6;--green:#22c55e;--red:#ef4444}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .wrap{width:min(920px,calc(100% - 32px));margin:40px auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;margin:16px 0}
    h1{font-size:1.6rem;margin:0 0 8px}h2{font-size:1.1rem}.muted{color:var(--muted)}a{color:#93c5fd;overflow-wrap:anywhere}
    input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#0b1728;color:var(--text);font:inherit}
    label{display:block;margin:16px 0 8px}.btn{display:inline-flex;justify-content:center;align-items:center;padding:12px 18px;border:0;border-radius:10px;background:var(--blue);color:white;text-decoration:none;font-weight:700;cursor:pointer}
    .btn-danger{background:#991b1b}.btn-secondary{background:#334155}.btn-block{width:100%}.errorlist{color:#fca5a5}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
    .status{font-weight:700}.active{color:#86efac}.expired{color:#fca5a5}.qr{width:min(280px,100%);background:white;padding:12px;border-radius:12px}
    .center{text-align:center}.actions{display:flex;gap:10px;flex-wrap:wrap}.notice{padding:12px;border-radius:10px;background:#1e3a5f;color:#dbeafe;margin:12px 0}
    @media(max-width:640px){.wrap{margin:20px auto}.panel{padding:18px}table{font-size:.85rem}th,td{padding:8px 4px}}
  </style>
</head>
<body><main class="wrap">{% if messages %}{% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main></body>
</html>
