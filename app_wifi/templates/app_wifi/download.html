{% extends "app_wifi/base.html" %}
{% block title %}Wi-Fi設定ダウンロード{% endblock %}
{% block content %}
<div class="panel center" style="max-width:520px;margin:8vh auto">
  <div style="font-size:48px">⌁</div>
  <h1>{{ profile_name }}</h1>
  <p class="muted">iPhone用のWi-Fi接続プロファイルをダウンロードできます。</p>
  <a class="btn btn-block" href="{{ download_url }}">プロファイルをダウンロード</a>
  <p class="muted" style="font-size:.88rem;margin-top:20px">ダウンロード後、「設定」アプリの「プロファイルがダウンロード済み」からインストールしてください。</p>
</div>
{% endblock %}
